<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>dinrr – group chat TikTok</title>
<style>
@font-face { font-family: 'DM Sans'; font-weight: 300 700; src: url(fonts/dm-sans-latin-opsz-normal.woff2) format('woff2-variations'); }
@font-face { font-family: 'DM Serif Display'; font-style: normal; src: url(fonts/dm-serif-display-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'DM Serif Display'; font-style: italic; src: url(fonts/dm-serif-display-latin-400-italic.woff2) format('woff2'); }
:root {
  --bg:#F2EFE9; --surface:#FDFCFA; --surface-alt:#F0EDE7; --ink:#1A1714; --ink-2:#5C5650; --ink-3:#A39C95;
  --green:#2A4D0F; --green-mid:#3D7016; --green-tint:#EBF2E2; --green-soft:#C9D9B5;
  --border:rgba(50,42,34,0.09); --border-mid:rgba(50,42,34,0.16);
  
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
body { font-family: 'DM Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }

/* Soft background shapes so the frame never looks empty */
.blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.55; will-change: transform; }
#blob1 { width: 420px; height: 420px; background: #E4ECD9; left: -160px; top: -120px; }
#blob2 { width: 380px; height: 380px; background: #EEE3D3; right: -170px; bottom: 40px; }

/* Phone */
#phone { position: absolute; left: 50%; top: 50%; width: 332px; height: 695px; margin: -347.5px 0 0 -166px; border-radius: 54px; background: #1A1714; padding: 10px;
  box-shadow: 0 40px 80px rgba(42,77,15,0.20), 0 12px 30px rgba(26,23,20,0.20); will-change: transform; transform-origin: 50% 50%; }
#screen { position: relative; width: 312px; height: 675px; border-radius: 44px; overflow: hidden; background: var(--bg); }
#app { position: absolute; left: 0; top: 37.6px; width: 390px; height: 763px; border: 0; transform: scale(0.8); transform-origin: 0 0; }
#island { position: absolute; top: 9px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #000; z-index: 6; }
#home { position: absolute; bottom: 7px; left: 50%; width: 112px; height: 4px; margin-left: -56px; border-radius: 3px; background: rgba(26,23,20,0.85); z-index: 6; }
#status { position: absolute; left: 0; right: 0; top: 0; height: 37.6px; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 30px; font-size: 12.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
#status .icons { display: flex; gap: 5px; align-items: center; }
#statusbg { position: absolute; left: 0; right: 0; top: 0; height: 37.6px; background: var(--bg); z-index: 4; }

/* Chat (drawn at 390-wide device px, scaled 0.8 like the app) */
#chatwrap { position: absolute; left: 0; top: 37.6px; width: 390px; height: 763px; transform: scale(0.8); transform-origin: 0 0; z-index: 3; background: var(--bg); display: flex; flex-direction: column; }
.chat-hd { display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px; border-bottom: 1px solid var(--border); background: rgba(242,239,233,0.96); }
.chat-hd .back { width: 22px; color: var(--green); font-size: 26px; line-height: 1; }
.chat-hd .gav { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-style: italic; font-size: 20px; }
.chat-hd .ttl { font-weight: 600; font-size: 17px; line-height: 1.2; }
.chat-hd .sub { font-size: 12px; color: var(--ink-3); }
.chat-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 14px 6px; }
.stamp { text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.04em; padding: 6px 0 10px; }
.msg { overflow: hidden; flex-shrink: 0; }
img.e { height: 1.12em; width: auto; vertical-align: -0.2em; margin: 0 0.04em; }
.msg-in { display: flex; gap: 8px; align-items: flex-end; padding: 3px 0; transform-origin: 0 100%; }
.msg.me .msg-in { justify-content: flex-end; transform-origin: 100% 100%; }
.av { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.who { font-size: 11px; font-weight: 700; margin: 0 0 2px 12px; }
.bubble { max-width: 250px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 20px 6px; padding: 9px 14px; font-size: 16px; line-height: 1.3; box-shadow: 0 1px 2px rgba(26,23,20,0.04); }
.me .bubble { background: var(--green); color: #fff; border-color: var(--green); border-radius: 20px 20px 6px 20px; }
.typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: block; }
/* dinrr card shared in the chat */
.card { width: 252px; background: var(--surface); border: 1px solid rgba(42,77,15,0.2); border-radius: 22px; padding: 14px 16px 14px; box-shadow: 0 8px 24px rgba(42,77,15,0.12); position: relative; }
.card .brand { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 17px; color: var(--ink); }
.card .brand sup { font-family: 'DM Sans'; font-style: normal; font-size: 9px; font-weight: 700; color: var(--green); }
.card .lbl { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--green-mid); text-transform: uppercase; }
.card .lbl i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: block; }
.card .meal { font-family: 'DM Serif Display', serif; font-size: 27px; line-height: 1.1; margin-top: 4px; }
.card .prog { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--ink-2); }
.card .bar { flex: 1; height: 4px; border-radius: 3px; background: var(--surface-alt); overflow: hidden; }
.card .bar b { display: block; width: 0%; height: 100%; background: var(--green-mid); }
.card .open { margin-top: 11px; min-height: 34px; border-radius: 100px; background: var(--green); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.react { position: absolute; left: -8px; bottom: -12px; background: var(--surface); border: 1px solid var(--border-mid); border-radius: 100px; padding: 3px 8px 3px 6px; display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--ink-2); box-shadow: 0 2px 8px rgba(26,23,20,0.12); opacity: 0; }
.chat-ft { display: flex; gap: 8px; align-items: center; padding: 8px 14px 14px; border-top: 1px solid var(--border); }
.chat-ft .field { flex: 1; height: 40px; border-radius: 100px; border: 1px solid var(--border-mid); background: var(--surface); padding: 0 16px; display: flex; align-items: center; font-size: 15px; color: var(--ink-3); }
.chat-ft .send { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; }

/* Captions (TikTok-style text, in the top safe zone) */
.cap { position: absolute; left: 50%; top: 92px; z-index: 20; transform: translateX(-50%); white-space: nowrap; opacity: 0; will-change: transform, opacity; }
.cap span { display: inline-block; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 25px; letter-spacing: -0.015em; line-height: 1.15; padding: 9px 16px 10px; border-radius: 14px; box-shadow: 0 6px 22px rgba(26,23,20,0.16); }
.cap span em { font-style: normal; color: var(--green); }
.cap.dark span { background: var(--green); color: #fff; }

#tap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(26,23,20,0.24); border: 2px solid rgba(255,255,255,0.95); box-shadow: 0 2px 10px rgba(26,23,20,0.2); opacity: 0; pointer-events: none; z-index: 30; }

/* End card */
#end { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; }
#endbg { position: absolute; inset: 0; z-index: 24; background: var(--bg); opacity: 0; }
#end .brand { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 124px; letter-spacing: -0.03em; line-height: 1; }
#end .brand sup { font-family: 'DM Sans', sans-serif; font-style: normal; font-size: 42px; font-weight: 700; color: var(--green); vertical-align: 0.95em; margin-left: 6px; }
#end .tag { margin-top: 16px; font-size: 21px; color: var(--ink-2); }
#end .pill { margin-top: 30px; display: inline-flex; background: var(--green); color: #fff; border-radius: 100px; padding: 14px 26px; font-size: 18px; font-weight: 600; box-shadow: 0 10px 28px rgba(42,77,15,0.3); }
#end .ask { margin-top: 26px; font-size: 16px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="blob" id="blob1"></div><div class="blob" id="blob2"></div>

<div id="phone"><div id="screen">
  <div id="statusbg"></div>
  <div id="status"><span id="clock">17:01</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1" fill="#1A1714"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1714"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1714"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#1A1714"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x="0.5" y="0.5" width="20" height="11" rx="3.2" fill="none" stroke="#1A1714" opacity="0.4"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#1A1714"/><rect x="21.5" y="4" width="1.8" height="4" rx="0.9" fill="#1A1714" opacity="0.4"/></svg>
    </span></div>
  <div id="island"></div>
  <iframe id="app" src="http://localhost:4173/" title="dinrr"></iframe>
  <div id="chatwrap">
    <div class="chat-hd">
      <span class="back">‹</span>
      <span class="gav">F</span>
      <div><div class="ttl">Family 🏠</div><div class="sub">Mom, Dad, Emma, Noah, You</div></div>
    </div>
    <div class="chat-body" id="chat">
      <div class="stamp">Today 16:31</div>
    </div>
    <div class="chat-ft"><div class="field">Message</div><div class="send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div>
  </div>
  <div id="home"></div>
</div></div>

<div class="cap" id="cap"><span id="capt"></span></div>
<div id="tap"></div>
<div id="endbg"></div>
<div id="end">
  <div class="brand">dinrr<sup>+</sup></div>
  <p class="tag">The week's dinners – planned together.</p>
  <div class="pill">Coming soon</div>
  <p class="ask">how many times does YOUR family ask? 👇</p>
</div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = (id) => document.getElementById(id);

// Noto emoji as images (Google, Apache-2.0) so they render the same everywhere
const EMO = { "😭": "1f62d", "😩": "1f629", "🙃": "1f643", "😳": "1f633", "🙏": "1f64f", "🌮": "1f32e", "😌": "1f60c", "👇": "1f447", "❤️": "2764-fe0f", "🏠": "1f3e0", "🚗": "1f697" };
const emo = (str) => Object.entries(EMO).reduce((acc, [ch, cp]) => acc.split(ch).join(`<img class="e" src="emoji/${cp}.png" alt="">`), str);
document.querySelectorAll(".ttl, #end .ask").forEach((el) => { el.innerHTML = emo(el.innerHTML); });

const PEOPLE = {
  Mom: { c: "#3D7016" }, Dad: { c: "#7A5A3A" }, Emma: { c: "#B5653A" }, Noah: { c: "#4D6A8A" }, You: {},
};
// Chat script: [time, who, text | {typing} | {card}]
const SCRIPT = [
  [-1, "Emma", "has anyone seen my black hoodie"],
  [-1, "Mom", "laundry"],
  [-1, "Dad", "who's home tonight?"],
  [-1, "Mom", "dentist tomorrow at 8, Noah"],
  [-1, "Noah", "ok"],
  [-1, "Emma", "can someone pick me up from practice"],
  [-1, "Dad", "on my way 🚗"],
  [-1, "Noah", "who took my charger"],
  [-1, "{stamp}", "Today 17:01"],
  [0.22, "Mom", "what's for dinner?"],
  [0.62, "Dad", "what's for dinner"],
  [0.98, "Emma", "are we eating today??"],
  [1.30, "Noah", "im hungry 😩"],
  [1.62, "Mom", "???"],
  [1.92, "Dad", "hello?? 🙃"],
  [2.20, "Emma", "{typing}", 2.75],
  [3.02, "You", "{card}"],
  [15.45, "Mom", "wait who planned the whole week?? 😳"],
  [16.25, "Emma", "finally 🙏"],
  [16.85, "Noah", "can we do tacos friday 🌮"],
];
const chat = $("chat");
const msgs = SCRIPT.map(([at, who, text, until]) => {
  const wrap = document.createElement("div");
  wrap.className = "msg" + (who === "You" ? " me" : "");
  if (who === "{stamp}") {
    wrap.innerHTML = `<div class="msg-in" style="justify-content:center"><div class="stamp" style="padding:8px 0 6px">${text}</div></div>`;
    chat.appendChild(wrap);
    return { at, wrap, inner: wrap.firstChild, h: 0 };
  }
  const inner = document.createElement("div");
  inner.className = "msg-in";
  if (who === "You") {
    inner.innerHTML = `<div class="card"><div class="brand">dinrr<sup>+</sup></div><div class="lbl"><i></i>Tonight · Wednesday</div><div class="meal">Chicken curry</div><div class="prog"><div class="bar"><b id="cardbar"></b></div><span>6 items on the list</span></div><div class="open">See the whole week</div><div class="react" id="react">${emo("❤️")} 2</div></div>`;
  } else {
    const p = PEOPLE[who];
    const body = text === "{typing}" ? `<div class="bubble typing"><i></i><i></i><i></i></div>` : `<div class="bubble">${emo(text)}</div>`;
    inner.innerHTML = `<span class="av" style="background:${p.c}">${who[0]}</span><div><div class="who" style="color:${p.c}">${who}</div>${body}</div>`;
  }
  wrap.appendChild(inner);
  chat.appendChild(wrap);
  return { at, until, wrap, inner, typing: text === "{typing}", h: 0 };
});
// measure natural heights (call again once fonts have loaded)
window.measure = () => msgs.forEach((m) => { m.wrap.style.height = "auto"; m.h = m.wrap.offsetHeight; m.wrap.style.height = "0px"; });
window.measure();

const CAPS = [
  { a: -1, b: 2.72, html: "every family group chat at 5pm 😭" },
  { a: 2.9, b: 4.45, html: "so I fixed it", dark: true },
  { a: 4.85, b: 9.05, html: "plan the <em>whole week</em> in 1 minute" },
  { a: 9.35, b: 13.95, html: "the shopping list <em>writes itself</em>" },
  { a: 15.25, b: 17.95, html: "the group chat is quiet now 😌" },
];

// Phone zoom: in (chat) → out (app) → in (chat) → end
const ZOOM_IN = 1.34, ZOOM_OUT = 0.9;
function phoneState(t) {
  const out = inOut(span(t, 3.95, 4.75)), back = inOut(span(t, 14.45, 15.2)), end = inOut(span(t, 17.95, 18.6));
  let s = ZOOM_IN + (ZOOM_OUT - ZOOM_IN) * out + (ZOOM_IN - ZOOM_OUT) * back;
  let y = 6 * (1 - out) + 52 * out - 46 * back;      // shift down a little in app mode (captions on top)
  s = s * (1 - 0.12 * end); y = y + 40 * end;
  // tiny shake on the freeze beat
  const sh = t > 2.72 && t < 2.95 ? Math.sin(t * 160) * 2.2 * (1 - span(t, 2.72, 2.95)) : 0;
  return { s, y, sh, chat: 1 - span(t, 4.5, 4.78) + span(t, 14.62, 14.9), end };
}

const CLOCK = [[0, "17:01"], [0.85, "17:02"], [1.55, "17:03"], [2.15, "17:04"], [6.5, "17:05"], [11.5, "17:06"], [15.0, "17:07"]];

window.render = (t, tap) => {
  // background drift
  $("blob1").style.transform = `translate(${Math.sin(t * 0.5) * 18}px, ${Math.cos(t * 0.4) * 14}px)`;
  $("blob2").style.transform = `translate(${Math.cos(t * 0.45) * 16}px, ${Math.sin(t * 0.35) * 18}px)`;

  const p = phoneState(t);
  $("phone").style.transform = `translate(${p.sh}px, ${p.y}px) scale(${p.s})`;
  // "switch app" swipe: chat slides out left, dinrr slides in from the right (and back)
  const sw = inOut(span(t, 4.38, 4.82)) - inOut(span(t, 14.55, 14.98));
  $("chatwrap").style.transform = `translateX(${-312 * sw}px) scale(0.8)`;
  $("app").style.transform = `translateX(${312 * (1 - sw)}px) scale(0.8)`;
  $("chatwrap").style.visibility = sw >= 0.999 ? "hidden" : "visible";

  // clock
  let clock = CLOCK[0][1];
  for (const [at, v] of CLOCK) if (t >= at) clock = v;
  $("clock").textContent = clock;

  // messages
  for (const m of msgs) {
    let k = back(span(t, m.at, m.at + 0.32));
    let hk = ease(span(t, m.at, m.at + 0.22));
    if (m.typing && m.until) { const gone = ease(span(t, m.until, m.until + 0.18)); k *= 1 - gone; hk *= 1 - gone; }
    m.wrap.style.height = (m.h * hk) + "px";
    m.inner.style.opacity = clamp(k * 1.2);
    m.inner.style.transform = `translateY(${(1 - clamp(k)) * 12}px) scale(${0.86 + 0.14 * k})`;
    if (m.typing) m.inner.querySelectorAll(".typing i").forEach((d, i) => { d.style.transform = `translateY(${-3 * Math.max(0, Math.sin(t * 10 - i * 0.9))}px)`; d.style.opacity = 0.5 + 0.5 * Math.max(0, Math.sin(t * 10 - i * 0.9)); });
  }
  const bar = $("cardbar"); if (bar) bar.style.width = (100 * ease(span(t, 3.25, 3.9)) * 0.5) + "%";
  const react = $("react"); if (react) { const r = back(span(t, 15.95, 16.3)); react.style.opacity = clamp(r * 1.3); react.style.transform = `scale(${0.4 + 0.6 * r})`; }

  // caption
  const c = CAPS.find((c) => t >= c.a && t < c.b);
  const capEl = $("cap");
  if (c) {
    if (capEl.dataset.k !== c.html) { capEl.dataset.k = c.html; $("capt").innerHTML = emo(c.html); capEl.className = "cap" + (c.dark ? " dark" : ""); }
    const kin = back(span(t, c.a, c.a + 0.3)), kout = ease(span(t, c.b - 0.18, c.b));
    capEl.style.opacity = clamp(kin * 1.4) * (1 - kout);
    capEl.style.transform = `translateX(-50%) translateY(${(1 - clamp(kin)) * 10}px) scale(${0.8 + 0.2 * kin - 0.06 * kout})`;
  } else capEl.style.opacity = 0;

  // tap indicator
  if (tap) {
    const d = t - tap.t;
    const vis = d < -0.28 ? 0 : d < -0.12 ? (d + 0.28) / 0.16 : d < 0.18 ? 1 : Math.max(0, 1 - (d - 0.18) / 0.2);
    const press = d < -0.12 ? 1 : d < 0 ? 1 - 0.25 * ((d + 0.12) / 0.12) : 0.75 + 0.35 * clamp(d / 0.25);
    $("tap").style.opacity = vis; $("tap").style.left = tap.x + "px"; $("tap").style.top = tap.y + "px"; $("tap").style.transform = `scale(${press})`;
  } else $("tap").style.opacity = 0;

  // end card
  const e = ease(span(t, 18.1, 18.7));
  $("endbg").style.opacity = e * 0.94;
  $("end").style.opacity = e;
  $("end").style.transform = `translateY(${(1 - e) * 22}px)`;
};
window.render(0, null);
</script>
</body>
</html>
