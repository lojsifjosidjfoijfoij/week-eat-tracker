<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>dinrr ad stage</title>
<style>
@font-face { font-family: 'DM Sans'; font-weight: 300 700; src: url(../fonts/dm-sans-latin-opsz-normal.woff2) format('woff2-variations'); }
@font-face { font-family: 'DM Serif Display'; font-style: normal; src: url(../fonts/dm-serif-display-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'DM Serif Display'; font-style: italic; src: url(../fonts/dm-serif-display-latin-400-italic.woff2) format('woff2'); }
:root { --bg:#F2EFE9; --surface:#FDFCFA; --ink:#1A1714; --ink-2:#5C5650; --ink-3:#A39C95; --green:#2A4D0F; --green-mid:#3D7016; --green-tint:#EBF2E2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
body { font-family: 'DM Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; will-change: opacity, transform; }
#hook h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 62px; line-height: 1.05; letter-spacing: -0.01em; }
#hook h1 em { color: var(--green); }
#hook { justify-content: flex-start; padding-top: 150px; }
#hook .sub { margin-top: 18px; font-size: 26px; color: var(--ink-2); font-weight: 500; }
#hook .field { margin-top: 46px; display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 22px; padding: 18px 30px; font-family: 'DM Serif Display', serif; font-size: 46px; box-shadow: 0 14px 34px rgba(26,23,20,0.12); }
#hook .field .spark { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; color: var(--green); background: var(--green-tint); border-radius: 100px; padding: 6px 12px; }
#hook .kicker { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 36px; color: var(--ink-2); margin-bottom: 8px; }
#hook h1 { font-size: 50px; padding: 0 28px; }
#hook { padding-top: 96px; }
#hook h1 em { color: var(--green); font-style: italic; }
#bubbles { position: relative; margin-top: 30px; width: 460px; height: 330px; }
#bubbles .b { position: absolute; background: var(--surface); border-radius: 22px 22px 22px 6px; padding: 12px 20px; font-size: 24px; font-weight: 600; box-shadow: 0 10px 26px rgba(26,23,20,0.12); white-space: nowrap; }
#bubbles .b small { display: block; font-size: 14px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
#count { position: absolute; right: -6px; top: -26px; background: #B3261E; color: #fff; font-family: 'DM Serif Display', serif; font-size: 58px; line-height: 1; padding: 12px 22px 14px; border-radius: 100px; box-shadow: 0 12px 28px rgba(179,38,30,0.35); transform: rotate(6deg); z-index: 5; }
#hook .sub { margin-top: 18px; font-size: 26px; color: var(--ink-2); font-weight: 500; }
#end .ask { margin-top: 26px; font-family: 'DM Serif Display', serif; font-size: 30px; color: var(--ink); }
#logo .brand, #end .brand { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 132px; letter-spacing: -0.03em; line-height: 1; }
#logo .brand sup, #end .brand sup { font-family: 'DM Sans', sans-serif; font-style: normal; font-size: 44px; font-weight: 700; color: var(--green); vertical-align: 0.95em; margin-left: 6px; }
#caption { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
#caption h2 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 44px; line-height: 1.08; letter-spacing: -0.01em; }
#caption p { margin-top: 10px; font-size: 17px; color: var(--ink-2); }
.phone { position: absolute; top: 262px; width: 250px; height: 502px; border-radius: 42px; background: #1A1714; padding: 8px; box-shadow: 0 30px 60px rgba(42,77,15,0.18), 0 10px 24px rgba(26,23,20,0.18); will-change: transform, opacity; }
#pmom { left: 12px; } #pdad { left: 278px; }
.screen { position: relative; width: 234px; height: 486px; border-radius: 34px; overflow: hidden; background: var(--bg); }
.island { position: absolute; top: 7px; left: 50%; width: 70px; height: 20px; margin-left: -35px; border-radius: 11px; background: #000; z-index: 3; }
.screen iframe { position: absolute; left: 0; top: 28px; width: 390px; height: 763px; border: 0; transform: scale(0.6); transform-origin: 0 0; }
.home { position: absolute; bottom: 5px; left: 50%; width: 84px; height: 4px; margin-left: -42px; border-radius: 3px; background: rgba(26,23,20,0.85); z-index: 3; }
.who { position: absolute; top: -50px; left: 0; right: 0; text-align: center; }
.who span { display: inline-block; background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; padding: 7px 18px; border-radius: 100px; letter-spacing: 0.02em; }
#pdad .who span { background: var(--green); }
.ring { position: absolute; border: 3px solid #F2B705; border-radius: 16px; box-shadow: 0 0 0 6px rgba(242,183,5,0.25); opacity: 0; pointer-events: none; z-index: 9; }
#caption { top: 52px; }
#tap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(26,23,20,0.24); border: 2px solid rgba(255,255,255,0.95); box-shadow: 0 2px 10px rgba(26,23,20,0.2); opacity: 0; pointer-events: none; z-index: 10; }
#end .tag { margin-top: 18px; font-size: 21px; color: var(--ink-2); }
#end .pill { margin-top: 34px; display: inline-flex; align-items: center; gap: 10px; background: var(--green); color: #fff; border-radius: 100px; padding: 15px 28px; font-size: 18px; font-weight: 600; box-shadow: 0 10px 28px rgba(42,77,15,0.3); }
#end .langs { margin-top: 22px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
</style>
</head>
<body>
<div id="hook" class="layer"><p class="kicker">be honest…</p><h1>how many times did your family ask <em>“what’s for dinner?”</em> today?</h1>
<div id="bubbles"><div id="count">×47</div></div>
<p class="sub">we stopped asking. here’s why ↓</p></div>
<div id="caption"><h2 id="cap-h"></h2><p id="cap-p"></p></div>
<div class="phone" id="pmom"><div class="who"><span>Mom · at home</span></div><div class="screen"><div class="island"></div><iframe id="mom" name="mom" src="http://localhost:4173/" title="dinrr mom"></iframe><div class="home"></div></div></div>
<div class="phone" id="pdad"><div class="who"><span>Dad · at the store</span></div><div class="screen"><div class="island"></div><iframe id="dad" name="dad" src="http://localhost:4173/" title="dinrr dad"></iframe><div class="home"></div></div></div>
<div class="ring" id="ring"></div>
<div id="tap"></div>
<div id="end" class="layer">
  <div class="brand">dinrr<sup>+</sup></div>
  <p class="tag" id="end-tag">Plan it once. The whole family sees it.</p>
  <div class="pill" id="end-pill">Coming soon to the App Store</div>
  <p class="ask" id="end-ask">Be honest: how many times today? 👇</p>
</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = (id) => document.getElementById(id);
document.documentElement.lang = "en";

const CAPTIONS = [
  { a: 2.8, b: 7.6, h: "Mom plans Thursday.", p: "Types “Tacos” – the ingredients fill in." },
  { a: 7.7, b: 11.6, h: "Dad sees it. Instantly.", p: "No text. No call. No “what’s for dinner?”" },
  { a: 11.7, b: 15.6, h: "One week. One list. Live.", p: "Everyone in the family sees every change." },
];
// "what's for dinner?" bubbles: visible at frame 0, more pile in fast
const B = [
  ["Emma", "what’s for dinner?", 10, 20, -3], ["Dad", "what's for dinner??", 190, 80, 2], ["Leo", "whats for dinner", 30, 140, 1],
  ["Emma", "MOM. dinner??", 220, 190, -2], ["Dad", "what are we eating?", 6, 250, 2], ["Leo", "dinner?", 300, 262, -4],
];
$("bubbles").insertAdjacentHTML("beforeend", B.map(([w, m, x, y, r]) => `<div class="b" style="left:${x}px;top:${y}px;--r:${r}deg"><small>${w}</small>${m}</div>`).join(""));
const bubs = [...document.querySelectorAll("#bubbles .b")];
let ringBox = null;
window.setRing = (box) => { ringBox = box; };
window.render = (t, tap) => {
  const hookOut = ease(span(t, 1.95, 2.35)), bump = 1 + 0.04 * Math.max(0, 1 - t / 0.35);
  $("hook").style.opacity = 1 - hookOut;
  $("hook").style.transform = `translateY(${-hookOut * 40}px) scale(${bump})`;
  bubs.forEach((el, i) => {
    const appear = i < 3 ? 1 : ease(span(t, 0.2 + (i - 3) * 0.35, 0.4 + (i - 3) * 0.35));
    const k = span(t, 0.2 + i * 0.3, 0.45 + i * 0.3), b = Math.sin(Math.PI * k);
    el.style.opacity = appear;
    el.style.transform = `rotate(${el.style.getPropertyValue("--r")}) scale(${(0.7 + 0.3 * appear) * (1 + 0.06 * b)})`;
  });
  const n = Math.round(47 + 52 * ease(span(t, 0.3, 1.8)));
  $("count").textContent = "×" + (n >= 99 ? "99+" : n);
  $("count").style.transform = `rotate(6deg) scale(${1 + 0.08 * Math.abs(Math.sin(t * 9))})`;
  // Phones
  const up = inOut(span(t, 2.0, 2.8)), down = inOut(span(t, 15.7, 16.4));
  ["pmom", "pdad"].forEach((id, i) => {
    const u = inOut(span(t, 2.0 + i * 0.12, 2.8 + i * 0.12));
    $(id).style.opacity = clamp(u * 1.4) * (1 - down);
    $(id).style.transform = `translateY(${(1 - u) * 760 + down * 120}px) scale(${1 - down * 0.06})`;
  });
  // Captions
  const c = CAPTIONS.find((c) => t >= c.a - 0.05 && t < c.b);
  if (c) {
    if ($("cap-h").textContent !== c.h) { $("cap-h").textContent = c.h; $("cap-p").textContent = c.p; }
    const k = ease(span(t, c.a, c.a + 0.45)) * (1 - ease(span(t, c.b - 0.3, c.b)));
    $("caption").style.opacity = k;
    $("caption").style.transform = `translateY(${(1 - k) * 14}px)`;
  } else $("caption").style.opacity = 0;
  // Highlight ring around the row that just changed live on Dad's phone
  if (ringBox) {
    const d = t - ringBox.t, v = d < 0 ? 0 : d < 0.25 ? d / 0.25 : d < ringBox.hold ? 1 : Math.max(0, 1 - (d - ringBox.hold) / 0.3);
    Object.assign($("ring").style, { left: ringBox.x - 4 + "px", top: ringBox.y - 4 + "px", width: ringBox.w + 8 + "px", height: ringBox.h + 8 + "px", opacity: v * (1 - down), transform: `scale(${1 + 0.05 * Math.sin(Math.PI * clamp(d / 0.4))})` });
  } else $("ring").style.opacity = 0;
  // Tap indicator
  if (tap) {
    const d = t - tap.t;
    const vis = d < -0.28 ? 0 : d < -0.12 ? (d + 0.28) / 0.16 : d < 0.18 ? 1 : Math.max(0, 1 - (d - 0.18) / 0.2);
    const press = d < -0.12 ? 1 : d < 0 ? 1 - 0.25 * ((d + 0.12) / 0.12) : 0.75 + 0.35 * clamp(d / 0.25);
    $("tap").style.opacity = vis;
    $("tap").style.left = tap.x + "px"; $("tap").style.top = tap.y + "px";
    $("tap").style.transform = `scale(${press * 0.8})`;
  } else $("tap").style.opacity = 0;
  const endIn = ease(span(t, 16.1, 16.8));
  $("end").style.opacity = endIn;
  $("end").style.transform = `translateY(${(1 - endIn) * 26}px)`;
};
window.render(0, null);
</script>
</body>
</html>
